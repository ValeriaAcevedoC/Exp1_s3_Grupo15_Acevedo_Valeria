spring.application.name=guias

spring.datasource.url=${ORACLE_DB_URL}
spring.datasource.driverClassName=oracle.jdbc.OracleDriver
spring.datasource.username=${ORACLE_DB_USERNAME}
spring.datasource.password=${ORACLE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

spring.h2.console.enabled=false

efs.ruta=./efs/guias
aws.region=us-east-1
aws.s3.bucket=bucket-duoc-s3

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://duocazureva.b2clogin.com/5d3fcce5-e142-4263-9331-422b98a2a19a/v2.0/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://duocazureva.b2clogin.com/duocazureva.onmicrosoft.com/discovery/v2.0/keys?p=b2c_1_duocdemoazure_registro_login

# RabbitMQ
# spring.rabbitmq.host=localhost
spring.rabbitmq.host=rabbitmq-guias
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123

# Colas del sistema de guias
rabbitmq.cola.guias=guias.cola
